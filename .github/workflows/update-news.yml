- name: Configurar Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Instalar dependencias de RSS y traducción
    run: pip install feedparser deep-translator requests

  - name: Recolectar y traducir noticias de los 8 medios
    run: python scripts/fetch_news.py

  - name: Publicar cambios automáticamente en GitHub Pages
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "EuroLeague Pulse Bot"
      git add data/
      git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): actualizar noticias y rumores Euroliga" && git push)
